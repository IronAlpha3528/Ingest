[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest"
version = "0.1.0"
description = "Telegram to Obsidian capture pipeline powered by Sarvam AI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Abhay" }
]
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "sarvamai",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-frontmatter",
    "pymupdf",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
]

[project.scripts]
ingest = "ingest.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow/network-requiring (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
